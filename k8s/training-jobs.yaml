apiVersion: batch/v1
kind: Job
metadata:
  name: train-pizza-price
  namespace: mlops
  labels:
    app: pizza-price
    component: training
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: pizza-price
        component: training
    spec:
      nodeSelector:
        kubernetes.io/hostname: desktop-worker
      restartPolicy: OnFailure
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /models && chmod -R 777 /models && chown -R 1000:1000 /models"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: storage
              mountPath: /models
              subPath: models/pizza
      containers:
        - name: train-pizza
          image: mlops/train:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "pizza_price.train"]
          args:
            - "--model-dir"
            - "/models"
            - "--model-version"
            - "1.0.0"
            - "--register-mlflow"
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          env:
            - name: MODEL_DIR
              value: "/models"
            - name: MODEL_VERSION
              value: "1.0.0"
            - name: LEARNING_RATE
              value: "0.001"
            - name: N_ITERATIONS
              value: "2000"
            - name: TEST_SIZE
              value: "0.2"
            - name: RANDOM_SEED
              value: "42"
            - name: LOG_LEVEL
              value: "INFO"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: REGISTER_MLFLOW
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /models
              subPath: models/pizza
            - name: storage
              mountPath: /mlflow
              subPath: mlflow
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: mlops-storage-pvc
---
