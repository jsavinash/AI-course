apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}-api
  namespace: mlops
  labels:
    app: {{ .Values.appName }}-api
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.appName }}-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: mlops
automountServiceAccountToken: false
{{- end }}
