# Default values for the generic mlops-serving chart.
# Each app overrides appName, packageName, image.repository/tag, and resources
# via the environment overlays under k8s/overlays/<env>/values.yaml.

appName: pizza-price
packageName: pizza_price

image:
  repository: ghcr.io/example/mlops/serve
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8000

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

serviceAccount:
  create: true
  name: mlops-serving

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
