apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
  labels:
    app: mlflow
    component: tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
      component: tracking
  template:
    metadata:
      labels:
        app: mlflow
        component: tracking
    spec:
      nodeSelector:
        kubernetes.io/hostname: desktop-worker
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /mlflow/artifacts && chmod -R 777 /mlflow"]
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
              subPath: mlflow
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.14.1
          imagePullPolicy: IfNotPresent
          command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--serve-artifacts", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts"]
          env:
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "*"
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
              subPath: mlflow
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlops-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops
  labels:
    app: mlflow
    component: tracking
spec:
  selector:
    app: mlflow
    component: tracking
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  type: ClusterIP