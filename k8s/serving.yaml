apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizza-price-api
  namespace: mlops
  labels:
    app: pizza-price
    component: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pizza-price
      component: serving
  template:
    metadata:
      labels:
        app: pizza-price
        component: serving
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/hostname: desktop-worker
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /models && chmod -R 777 /models && chown -R 1000:1000 /models"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: storage
              mountPath: /models
              subPath: models/pizza
      containers:
        - name: pizza-api
          image: mlops/serve:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "pizza_price.api:app", "--host", "0.0.0.0", "--port", "8000"]
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MODEL_DIR
              value: "/models"
            - name: MODEL_VERSION
              value: "latest"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DRIFT_THRESHOLD
              value: "0.2"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: storage
              mountPath: /models
              subPath: models/pizza
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: mlops-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pizza-price-api
  namespace: mlops
  labels:
    app: pizza-price
    component: serving
spec:
  selector:
    app: pizza-price
    component: serving
  ports:
    - port: 80
      targetPort: 8000
      name: http
  type: ClusterIP
---
