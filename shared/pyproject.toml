[project]
name = "mlops-shared"
version = "0.2.0"
description = "Shared MLOps utilities for the monorepo"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
    "mlflow>=2.11.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
]

[tool.uv]
package = true