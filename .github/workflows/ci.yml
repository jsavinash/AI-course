name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy packages/ai-core apps/machine-learning apps/neural-networks apps/deep-learning apps/generative-ai --ignore-missing-imports

      - name: Run tests with coverage
        run: uv run pytest --cov=ai_core --cov-report=term-missing
