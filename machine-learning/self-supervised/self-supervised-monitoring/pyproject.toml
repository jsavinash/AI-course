[project]
name = "self-supervised-monitoring"
version = "0.1.0"
description = "Self-supervised learning for server monitoring anomaly detection - Denoising autoencoder"
requires-python = ">=3.11"
dependencies = [
    "mlops-shared",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "matplotlib>=3.7.0",
    "pandas>=2.2.0",
]

[project.scripts]
self-supervised-monitoring-train = "self_supervised_monitoring.train:main"

[tool.uv.sources]
mlops-shared = { workspace = true }

[tool.uv]
package = true
