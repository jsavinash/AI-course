[project]
name = "ai-core"
version = "0.3.0"
description = "Shared AI/ML foundation library for the monorepo"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0,<3",
    "scipy>=1.11.0,<2",
    "scikit-learn>=1.4.0,<2",
    "pandas>=2.2.0,<3",
    "joblib>=1.3.0",
    "mlflow>=2.11.0,<4",
    "fastapi>=0.110.0,<1",
    "uvicorn[standard]>=0.29.0,<1",
    "pydantic>=2.6.0,<3",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0.1,<7",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "matplotlib>=3.7.0,<4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

