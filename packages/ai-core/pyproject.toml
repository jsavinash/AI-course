[project]
name = "ai-core"
version = "0.3.0"
description = "Shared AI/ML foundation library for the monorepo"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
    "mlflow>=2.11.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

