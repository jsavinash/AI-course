[project]
name = "tool-use-functional-calling"
version = "0.1.0"
description = "Function calling (tool use) in LLMs covering architecture, workflow, applications, advantages and limitations from scratch using NumPy"
requires-python = ">=3.11"
dependencies = [
    "ai-core",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
tool-use-train = "tool_use_and_functional_calling.train:main"

[tool.uv.sources]
ai-core = { workspace = true }

[tool.uv]
package = true
