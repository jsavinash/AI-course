[project]
name = "spam-classification"
version = "0.2.0"
description = "Spam email classification - Logistic Regression MLOps example"
requires-python = ">=3.11"
dependencies = [
    "mlops-shared",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
spam-train = "spam_classification.train:main"

[tool.uv.sources]
mlops-shared = { workspace = true }

[tool.uv]
package = true