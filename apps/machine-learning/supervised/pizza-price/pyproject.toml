[project]
name = "pizza-price"
version = "0.2.0"
description = "Pizza price prediction - Linear Regression MLOps example"
requires-python = ">=3.11"
dependencies = [
    "ai-core",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
pizza-train = "pizza_price.train:main"

[tool.uv.sources]
ai-core = { workspace = true }

[tool.uv]
package = true