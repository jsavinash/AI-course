[project]
name = "recommendation-engine"
version = "0.1.0"
description = "Recommendation Engine - Association Rule Learning with Apriori Algorithm MLOps example"
requires-python = ">=3.11"
dependencies = [
    "mlops-shared",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
recommendation-engine-train = "recommendation_engine.train:main"

[tool.uv.sources]
mlops-shared = { workspace = true }

[tool.uv]
package = true