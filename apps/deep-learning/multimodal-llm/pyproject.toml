[project]
name = "multimodal-large-language-models"
version = "0.1.0"
description = "Multimodal Large Language Model (MLLM) that integrates text, image, and audio inputs using modality encoders, connectors, fusion mechanisms, and LLM backbone from scratch using NumPy"
requires-python = ">=3.11"
dependencies = [
    "ai-core",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "matplotlib>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
multimodal_llm-train = "multimodal_llm.train:main"

[tool.uv.sources]
ai-core = { workspace = true }

[tool.uv]
package = true
