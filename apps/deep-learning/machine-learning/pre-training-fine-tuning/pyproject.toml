[project]
name = "pre-training-fine-tuning"
version = "0.1.0"
description = "Pre-training and fine-tuning in deep learning: MLM, next-token prediction, representation learning, full/partial/feature-extraction/PEFT/LoRA/prompt tuning"
requires-python = ">=3.11"
dependencies = [
    "mlops-shared",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "matplotlib>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
pre-training-fine-tuning-train = "pre_training_fine_tuning.train:main"

[tool.uv.sources]
mlops-shared = { workspace = true }

[tool.uv]
package = true
