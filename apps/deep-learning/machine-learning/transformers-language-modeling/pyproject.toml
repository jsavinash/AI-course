[project]
name = "transformers-language-modeling"
version = "0.1.0"
description = "Transformer LLM with self-attention, multi-head attention, positional encoding, and encoder-decoder architecture"
requires-python = ">=3.11"
dependencies = [
    "mlops-shared",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "matplotlib>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
transformers_language_modeling-train = "transformers_language_modeling.train:main"

[tool.uv.sources]
mlops-shared = { workspace = true }

[tool.uv]
package = true
