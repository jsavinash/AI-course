[project]
name = "rbm-feature-learning"
version = "0.1.0"
description = "Stochastic neural networks that learn probability distributions over inputs using Contrastive Divergence"
requires-python = ">=3.11"
dependencies = [
    "mlops-shared",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "matplotlib>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
rbm_feature_learning-train = "rbm_feature_learning.train:main"

[tool.uv.sources]
mlops-shared = { workspace = true }

[tool.uv]
package = true
