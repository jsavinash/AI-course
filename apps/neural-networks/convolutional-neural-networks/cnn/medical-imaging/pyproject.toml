[project]
name = "medical-imaging"
version = "0.1.0"
description = "Detects tumors or fractures in synthetic medical X-ray, MRI, and CT scan images - CNN MLOps example"
requires-python = ">=3.11"
dependencies = [
    "mlops-shared",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "matplotlib>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
medical_imaging-train = "medical_imaging.train:main"

[tool.uv.sources]
mlops-shared = { workspace = true }

[tool.uv]
package = true
