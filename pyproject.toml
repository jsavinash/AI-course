[project]
name = "mlops-monorepo"
version = "0.3.0"
description = "Production-ready MLOps monorepo with supervised, unsupervised, reinforcement, self-supervised, and semi-supervised learning examples"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pizza-price",
    "spam-classification",
    "market-segmentation",
    "recommendation-engine",
    "anomaly-detection",
    "robot-maze-navigation",
    "semi-supervised-email",
    "self-supervised-monitoring",
    "email-spam-detection",
    "house-price-prediction",
    "credit-card-fraud-detection",
    "handwritten-digit-recognition",
    "language-translation",
    "sentiment-analysis",
    "text-generation",
    "text-gen",
    "image-generation",
    "video-generation",
    "speech-recognition",
    "music-generation",
    "stock-market-prediction",
    "weather-forecasting",
    "image-captioning",
    "medical-imaging",
    "facial-recognition",
    "video-surveillance",
    "image-super-resolution",
    "semantic-segmentation",
    "generative-art",
    "autonomous-driving",
    "medical-scan-analysis",
    "text-char-recognition",
    "gnn-social-networks",
    "pinn-heat-equation",
    "snn-image-classification",
    "transformers-language-modeling",
    "attention-mechanism",
    "large-language-model",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
    "mlflow>=2.11.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "matplotlib>=3.7.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.uv.workspace]
members = [
    "apps/machine-learning/supervised/pizza-price",
    "apps/machine-learning/supervised/spam-classification",
    "apps/machine-learning/unsupervised/market-segmentation",
    "apps/machine-learning/unsupervised/recommendation-engine",
    "apps/machine-learning/unsupervised/anomaly-detection",
    "apps/machine-learning/reinforcement/robot-maze-navigation",
    "apps/machine-learning/semi-supervised/semi-supervised-email",
    "apps/machine-learning/self-supervised/self-supervised-monitoring",
    "apps/neural-networks/feedforward-neural-networks/classification/email-spam-detection",
    "apps/neural-networks/feedforward-neural-networks/regression/house-price-prediction",
    "apps/neural-networks/feedforward-neural-networks/anomaly-detection/credit-card-fraud-detection",
    "apps/neural-networks/feedforward-neural-networks/pattern-recognition/handwritten-digit-recognition",
    "apps/neural-networks/recurrent-neural-networks/nlp/language-translation",
    "apps/neural-networks/recurrent-neural-networks/nlp/sentiment-analysis",
    "apps/neural-networks/recurrent-neural-networks/nlp/text-generation",
    "apps/neural-networks/recurrent-neural-networks/speech-audio/speech-recognition",
    "apps/neural-networks/recurrent-neural-networks/speech-audio/music-generation",
    "apps/neural-networks/recurrent-neural-networks/time-series-forecasting/stock-market-prediction",
    "apps/neural-networks/recurrent-neural-networks/time-series-forecasting/weather-forecasting",
    "apps/neural-networks/recurrent-neural-networks/vision-tasks/image-captioning",
    "apps/neural-networks/convolutional-neural-networks/cnn/medical-imaging",
    "apps/neural-networks/convolutional-neural-networks/cnn/facial-recognition",
    "apps/neural-networks/convolutional-neural-networks/cnn/video-surveillance",
    "apps/neural-networks/convolutional-neural-networks/dn/image-super-resolution",
    "apps/neural-networks/convolutional-neural-networks/dn/semantic-segmentation",
    "apps/neural-networks/convolutional-neural-networks/dn/generative-art",
    "apps/neural-networks/convolutional-neural-networks/capsnet/autonomous-driving",
    "apps/neural-networks/convolutional-neural-networks/capsnet/medical-scan-analysis",
    "apps/neural-networks/convolutional-neural-networks/capsnet/text-char-recognition",
    "apps/neural-networks/graph-physics-informed-networks/graph-neural-networks/social-networks",
    "apps/neural-networks/graph-physics-informed-networks/physics-informed-neural-networks/heat-equation",
    "apps/neural-networks/graph-physics-informed-networks/spiking-neural-networks/image-classification",
    "apps/deep-learning/machine-learning/transformers-language-modeling",
    "apps/deep-learning/machine-learning/attention-mechanism",
    "apps/deep-learning/machine-learning/large-language-model",
    "apps/deep-learning/machine-learning/pre-training-fine-tuning",
    "apps/generative-ai/prompt-engineering",
    "apps/generative-ai/code-generation",
    "apps/generative-ai/tool-use-and-functional-calling",
    "apps/generative-ai/text-gen",
    "apps/generative-ai/image-generation",
    "apps/generative-ai/video-generation",
    "apps/generative-ai/retrieval-augmented-generation",
    "shared",
]

[tool.uv.sources]
mlops-shared = { workspace = true }
pizza-price = { workspace = true }
spam-classification = { workspace = true }
market-segmentation = { workspace = true }
recommendation-engine = { workspace = true }
anomaly-detection = { workspace = true }
robot-maze-navigation = { workspace = true }
semi-supervised-email = { workspace = true }
self-supervised-monitoring = { workspace = true }
