[project]
name = "mlops-monorepo"
version = "0.3.0"
description = "Production-ready MLOps monorepo with supervised, unsupervised, reinforcement, self-supervised, and semi-supervised learning examples"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pizza-price",
    "spam-classification",
    "market-segmentation",
    "recommendation-engine",
    "anomaly-detection",
    "robot-maze-navigation",
    "mlops-shared",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
    "mlflow>=2.11.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "matplotlib>=3.7.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.uv.workspace]
members = [
    "machine-learning/supervised/pizza-price",
    "machine-learning/supervised/spam-classification",
    "machine-learning/unsupervised/market-segmentation",
    "machine-learning/unsupervised/recommendation-engine",
    "machine-learning/unsupervised/anomaly-detection",
    "machine-learning/reinforcement/robot-maze-navigation",
    "machine-learning/semi-supervised/semi-supervised-email",
    "machine-learning/self-supervised/self-supervised-monitoring",
    "shared",
]

[tool.uv.sources]
mlops-shared = { workspace = true }
pizza-price = { workspace = true }
spam-classification = { workspace = true }
market-segmentation = { workspace = true }
recommendation-engine = { workspace = true }
anomaly-detection = { workspace = true }
robot-maze-navigation = { workspace = true }
semi-supervised-email = { workspace = true }
self-supervised-monitoring = { workspace = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=. --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N803", "N806", "E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.black]
line-length = 100
target-version = ["py311"]