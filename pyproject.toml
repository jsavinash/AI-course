[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=. --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N802", "N803", "N806", "E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.black]
line-length = 100
target-version = ["py311"]