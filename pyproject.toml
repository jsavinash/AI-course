[project]
name = "mlops-monorepo"
version = "0.3.0"
description = "Production-ready MLOps monorepo with supervised, unsupervised, reinforcement, self-supervised, and semi-supervised learning examples"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
    "mlflow>=2.11.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "matplotlib>=3.7.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.uv.workspace]
members = [
    "apps/deep-learning/attention-mechanism",
    "apps/deep-learning/large-language-model",
    "apps/deep-learning/multimodal-llm",
    "apps/deep-learning/pre-training-fine-tuning",
    "apps/deep-learning/transfer-learning",
    "apps/deep-learning/transformers-language-modeling",
    "apps/generative-ai/code-generation",
    "apps/generative-ai/image-generation",
    "apps/generative-ai/prompt-engineering",
    "apps/generative-ai/retrieval-augmented-generation",
    "apps/generative-ai/text-generation",
    "apps/generative-ai/tool-use-functional-calling",
    "apps/generative-ai/video-generation",
    "apps/machine-learning/reinforcement/robot-maze-navigation",
    "apps/machine-learning/self-supervised/self-supervised-monitoring",
    "apps/machine-learning/semi-supervised/semi-supervised-email",
    "apps/machine-learning/supervised/pizza-price",
    "apps/machine-learning/supervised/spam-classification",
    "apps/machine-learning/unsupervised/anomaly-detection-pca",
    "apps/machine-learning/unsupervised/market-segmentation",
    "apps/machine-learning/unsupervised/recommendation-engine",
    "apps/neural-networks/attention-generative/diffusion",
    "apps/neural-networks/attention-generative/gan",
    "apps/neural-networks/attention-generative/transformers",
    "apps/neural-networks/attention-generative/vae",
    "apps/neural-networks/convolutional/advanced-generative-art",
    "apps/neural-networks/convolutional/advanced-semantic-segmentation",
    "apps/neural-networks/convolutional/advanced-super-resolution",
    "apps/neural-networks/convolutional/capsnet-autonomous-driving",
    "apps/neural-networks/convolutional/capsnet-medical-scan",
    "apps/neural-networks/convolutional/capsnet-text-recognition",
    "apps/neural-networks/convolutional/cnn-facial-recognition",
    "apps/neural-networks/convolutional/cnn-medical-imaging",
    "apps/neural-networks/convolutional/cnn-video-surveillance",
    "apps/neural-networks/feedforward/anomaly-detection-fraud",
    "apps/neural-networks/feedforward/classification-email-spam",
    "apps/neural-networks/feedforward/pattern-recognition-digits",
    "apps/neural-networks/feedforward/regression-house-price",
    "apps/neural-networks/graph-physics-informed/gnn-social-networks",
    "apps/neural-networks/graph-physics-informed/pinn-heat-equation",
    "apps/neural-networks/graph-physics-informed/snn-image-classification",
    "apps/neural-networks/recurrent/nlp-language-translation",
    "apps/neural-networks/recurrent/nlp-sentiment-analysis",
    "apps/neural-networks/recurrent/nlp-text-generation",
    "apps/neural-networks/recurrent/speech-audio-music",
    "apps/neural-networks/recurrent/speech-audio-recognition",
    "apps/neural-networks/recurrent/time-series-stock",
    "apps/neural-networks/recurrent/time-series-weather",
    "apps/neural-networks/recurrent/vision-image-captioning",
    "apps/neural-networks/unsupervised/autoencoders-dimensionality-reduction",
    "apps/neural-networks/unsupervised/deep-belief-networks",
    "apps/neural-networks/unsupervised/restricted-boltzmann-machines",
    "apps/neural-networks/unsupervised/self-organizing-maps",
    "packages/ai-core",
]

[tool.uv.sources]
ai-core = { workspace = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-v --import-mode=importlib --cov=ai_core --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N802", "N803", "N806", "E402", "N815"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
exclude = ["tests/", ".*tests/.*", ".*\\.venv/.*"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_expr = false
disallow_any_explicit = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disable_error_code = ["operator", "union-attr", "arg-type", "assignment", "index", "no-any-return", "call-arg", "attr-defined", "return-value", "import-not-found", "import-untyped"]

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "ai_core.nn_utils.*"
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.black]
line-length = 100
target-version = ["py311"]
